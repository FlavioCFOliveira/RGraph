name: Benchmark

on:
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install cargo-criterion
        run: cargo install cargo-criterion
      - name: Run benchmarks
        run: cargo criterion --message-format=json > benchmark.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
      - name: Check regression
        run: |
          # Placeholder for regression detection script.
          # In production this would compare against the previous
          # nightly baseline and alert if latency or throughput
          # regresses beyond the 5 % threshold.
          echo "Benchmark regression detection is a stub."
