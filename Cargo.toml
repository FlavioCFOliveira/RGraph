[package]
name = "rgraph"
version = "0.1.0"
edition = "2024"

# Declare the crate-private `rgraph_loom` cfg so `--cfg rgraph_loom` builds do
# not trip the `unexpected_cfgs` lint.  Only set by the loom model-check run:
#   RUSTFLAGS="--cfg rgraph_loom" cargo test --test loom_concurrency --release
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rgraph_loom)'] }

[features]
# Off by default: experimental, not yet wired into the B+ tree hot path.
#
# `epoch` — gates the `EpochPageTable` lock-free page-snapshot prototype.
#   It is NOT used by the tree today and acquires a mutex on every read, so
#   it provides no lock-free benefit.  Kept behind a flag until a genuine
#   lock-free integration lands (see TODO in `src/index/btree.rs`).
#
# `prefix_compression` — gates per-page key prefix compression.  The B+ tree
#   comparison/search paths read raw record bytes (not prefix-reconstructed
#   keys), so enabling compression would corrupt ordering and lookups.  Kept
#   behind a flag until every comparator is made prefix-aware.
default = []
epoch = ["dep:crossbeam-epoch"]
prefix_compression = []

[dependencies]
crc32c = "0.6"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
twox-hash = "1.6"
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossbeam-epoch = { version = "0.9", optional = true }
io-uring = "0.7"
parking_lot = "0.12"

# --- async / server ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
] }
async-trait = "0.1"
tonic = "0.12"
prost = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
prometheus = "0.13"
rayon = "1.10"
tower = { version = "0.5", features = ["limit", "timeout"] }
hyper = "1"
hyper-util = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
num_cpus = "1"
uuid = { version = "1", features = ["v4", "v7"] }
bincode = "1"
rowan = "0.16"
text-size = "1.1"
logos = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
tokio-test = "0.4"
criterion = "0.5"
cucumber = "0.23"
gherkin = "0.14"

[[bench]]
name = "btree_bench"
harness = false

[[bench]]
name = "csr_bench"
harness = false

[[bench]]
name = "query_dispatch_bench"
harness = false

# `loom` is only compiled under `--cfg rgraph_loom`, so it never enters the
# normal build or the regular test graph.  A crate-private cfg name (not the
# bare `loom`) prevents the flag leaking into dependencies such as tokio.  Run
# the concurrency models with:
#   RUSTFLAGS="--cfg rgraph_loom" cargo test --test loom_concurrency --release
[target.'cfg(rgraph_loom)'.dependencies]
loom = "0.7"

[build-dependencies]
tonic-build = "0.12"

# The loom concurrency models only build under `--cfg loom`; mark the harness
# as standard (libtest) so `cargo test --test loom_concurrency` discovers them.
[[test]]
name = "loom_concurrency"
harness = true
