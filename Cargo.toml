[package]
name = "rgraph"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32c = "0.6"
twox-hash = "1.6"
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
io-uring = "0.7"

# --- async / server ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
] }
async-trait = "0.1"
tonic = "0.12"
prost = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
prometheus = "0.13"
rayon = "1.10"
tower = "0.5"
hyper = "1"
hyper-util = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
num_cpus = "1"
uuid = { version = "1", features = ["v4", "v7"] }
bincode = "1"
rowan = "0.16"
text-size = "1.1"
logos = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
tokio-test = "0.4"
criterion = "0.5"
cucumber = "0.23"
gherkin = "0.14"

[[bench]]
name = "btree_bench"
harness = false

[build-dependencies]
tonic-build = "0.12"
